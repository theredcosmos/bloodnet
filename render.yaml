# Render Blueprint: free-tier deployment of BloodNet.
#   bloodnet-api  - Spring Boot API, built from backend/Dockerfile (free web service, sleeps after 15 min idle)
#   bloodnet-web  - Angular app as a static site; /api/* is rewritten to the API, so the browser sees
#                   one origin and needs no CORS
# MySQL is not offered on Render's free tier: use a free managed MySQL 8 (e.g. Aiven) and paste its
# connection details when Render asks for the "sync: false" values. Step by step: docs/DEPLOY.md
services:
  - type: web
    name: bloodnet-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # jdbc:mysql://<host>:<port>/defaultdb?sslMode=REQUIRED&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # free managed MySQL plans allow few connections; the free instance has 512 MB RAM
      - key: DB_POOL_SIZE
        value: "5"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -Duser.timezone=UTC"
      # random base64 256-bit value, generated once by Render
      - key: JWT_SECRET
        generateValue: true
      # the static site's URL, e.g. https://bloodnet-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # Demo accounts (admin/staff1/staff2/hospital @bloodnet.local) so reviewers can try every role.
      # Pick your own SEED_PASSWORD; set SEED_DEMO_USERS=false for a real deployment.
      - key: SEED_DEMO_USERS
        value: "true"
      - key: SEED_PASSWORD
        sync: false
      # Render's proxy sets X-Forwarded-For, not nginx's X-Real-IP
      - key: CLIENT_IP_HEADER
        value: X-Forwarded-For

  - type: web
    name: bloodnet-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npx ng build --configuration production
    staticPublishPath: dist/frontend/browser
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # If Render gives the API a different hostname, change these three destinations to match.
      - type: rewrite
        source: /api/*
        destination: https://bloodnet-api.onrender.com/api/*
      - type: rewrite
        source: /swagger-ui/*
        destination: https://bloodnet-api.onrender.com/swagger-ui/*
      - type: rewrite
        source: /v3/api-docs/*
        destination: https://bloodnet-api.onrender.com/v3/api-docs/*
      # Angular routes (/find, /inventory ...) are client-side
      - type: rewrite
        source: /*
        destination: /index.html
