# Full stack: nginx (Angular + /api proxy) -> Spring Boot app -> MySQL.
#   cp .env.example .env   (then set real secrets)
#   docker compose up -d --build
# Open http://localhost:8081
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bloodnet
      MYSQL_USER: bloodnet
      MYSQL_PASSWORD: ${DB_PASSWORD:-bloodnet}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ubloodnet", "-p${DB_PASSWORD:-bloodnet}"]
      interval: 5s
      retries: 30
    restart: unless-stopped

  app:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/bloodnet?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
      DB_USER: bloodnet
      DB_PASSWORD: ${DB_PASSWORD:-bloodnet}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-Bloodnet@123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_SIGNUP_CODE: ${ADMIN_SIGNUP_CODE:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  mysql-data:
